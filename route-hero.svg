<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Route — a live city map with a vehicle driving a route from pickup to destination">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c454f"/>
      <stop offset="1" stop-color="#1d2f37"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8973C"/>
      <stop offset="1" stop-color="#BD632F"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="880" height="340" rx="22" fill="url(#bg)"/>

  <!-- street grid -->
  <g stroke="#D8C99B" stroke-opacity="0.10" stroke-width="2">
    <path d="M0 60 H880 M0 120 H880 M0 180 H880 M0 240 H880 M0 300 H880"/>
    <path d="M110 0 V340 M220 0 V340 M330 0 V340 M440 0 V340 M550 0 V340 M660 0 V340 M770 0 V340"/>
  </g>
  <!-- a couple of thicker avenues -->
  <g stroke="#D8C99B" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round">
    <path d="M0 180 H880"/>
    <path d="M440 0 V340"/>
  </g>
  <!-- river -->
  <path d="M-20 300 C 180 250, 300 330, 520 280 S 780 250, 900 300" fill="none" stroke="#3f6b78" stroke-opacity="0.5" stroke-width="16" stroke-linecap="round"/>

  <!-- wordmark -->
  <g filter="url(#soft)">
    <rect x="34" y="30" width="46" height="46" rx="13" fill="#D8973C"/>
    <text x="57" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#273E47" text-anchor="middle">R</text>
  </g>
  <text x="92" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#F3ECD9">Route</text>
  <text x="94" y="86" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#D8C99B" fill-opacity="0.8">one city · every route home</text>

  <!-- the route path (dashed underlay + solid) -->
  <path id="ride" d="M150 250 C 300 205, 360 265, 470 195 S 690 150, 792 172" fill="none" stroke="#273E47" stroke-opacity="0.6" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 250 C 300 205, 360 265, 470 195 S 690 150, 792 172" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12" stroke-opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M150 250 C 300 205, 360 265, 470 195 S 690 150, 792 172" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- pickup pin -->
  <g>
    <circle cx="150" cy="250" r="10" fill="#A4243B"/>
    <circle cx="150" cy="250" r="10" fill="none" stroke="#A4243B" stroke-width="2">
      <animate attributeName="r" from="10" to="26" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.7" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="250" r="4" fill="#F3ECD9"/>
  </g>

  <!-- destination flag -->
  <g transform="translate(792,172)">
    <circle r="10" fill="#BD632F"/>
    <circle r="4" fill="#F3ECD9"/>
    <rect x="8" y="-30" width="20" height="14" fill="#D8C99B"/>
    <line x1="8" y1="-30" x2="8" y2="0" stroke="#D8C99B" stroke-width="2.5"/>
  </g>

  <!-- moving vehicle -->
  <g filter="url(#soft)">
    <g>
      <rect x="-12" y="-8" width="24" height="16" rx="5" fill="#D8973C"/>
      <rect x="-6" y="-8" width="12" height="7" rx="3" fill="#F3ECD9" fill-opacity="0.85"/>
      <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto" path="M150 250 C 300 205, 360 265, 470 195 S 690 150, 792 172"/>
    </g>
  </g>
</svg>
